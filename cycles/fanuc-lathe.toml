# NCX cycle catalog of the Fanuc lathes (machine-config 6, D160): the drilling cycles along Z and along X and the turning cycles, in the numbers of G-code
# system A. A Fanuc lathe machine file names this file in [cycles] catalog instead of fanuc.toml, which keeps the mill codes; the readers and compilers
# translate the numbers to the system of the machine through gcode_system (controllers fanuc.md 3, D174).
# Written from controllers/fanuc.md 3 and 6, controller-mapping.md 5, language 4.7 and 4.7.1 and the Fanuc lathe manual (B-64484GE-1/02, tables 4.3 (a) and
# 4.3 (b), sections 4.1 and 4.2), the pages the evidence of D160, D161 and D174 names. Not verified on a machine.
# D115: no kind key in 1.0; every parameter of this file that is not a word of language 4.7 takes a number or an expression, and the words of 4.7 keep
# their kinds.

# ---------------------------------------------------------------------------------------------------------------------------------------------------
# Drilling cycles of a lathe (fanuc 6, controller-mapping 5, AXIS; D59, D160)
#
# The canned-cycle group of a Fanuc lathe holds G80 and the two triples G83/G84/G85, which drill along Z with X and C as the positioning axes, and
# G87/G88/G89, which drill along X with Z and C. The two triples are otherwise identical in function, so each NCX cycle has two entries that differ by
# for_axis: the entry without the key maps the default axis, Z (machine-config 6, D160).
# DRILL and PECK share G83 and G87: of two entries on one native the reader takes the first in catalog order whose params cover the words of the block, so a
# block without a peck depth Q is DRILL and one with it PECK, which stands after DRILL (machine-config 6, D160). Without Q the control runs a plain drilling
# cycle and retracts from the bottom in rapid.
# CHIP_BREAK has no lathe code of its own: bit 2 (RTR) of parameter 5101 decides whether G83 pecks at high speed or retracts fully, and a builder selects it
# with a mode M code (Doosan M292), so a machine file carries it (machine-config 6, D160).
# G81 and G82 appear in the lathe G-code list only as FS15 format codes and G86 not at all, so DRILL_DWELL and BORE have no lathe entry (D160).
# TODO(question): a catalog file overrides and adds entries and cannot take one away (machine-config 6), so DRILL_DWELL, CHIP_BREAK and BORE stay in this
# catalog with the mill codes G82, G73 and G86 of the built-in family, which no Fanuc lathe has. The compiler reports such a cycle on a lathe, because the
# canned-cycle group of a lathe holds only G83 to G85 and G87 to G89 (D160); whether a catalog file should be able to remove an inherited entry is open.

[[cycle]]
name = "DRILL"
native = "G83"
modal = true
params = { DEPTH = "Z", CLEARANCE = "R", CYCLE_DWELL = "P", CYCLE_F = "F" }           # G83 Z-40. R-5. P500 F5.0 (fanuc lathe manual 4.3.1)

[[cycle]]
name = "DRILL"
for_axis = "X"
native = "G87"
modal = true
params = { DEPTH = "X", CLEARANCE = "R", CYCLE_DWELL = "P", CYCLE_F = "F" }           # G87 with X and Z exchanged (examples/POLAR_FACE.ncx)

[[cycle]]
name = "PECK"
native = "G83"
modal = true
params = { DEPTH = "Z", CLEARANCE = "R", PECK = "Q", CYCLE_DWELL = "P", CYCLE_F = "F" }   # Q is the depth of cut per infeed (fanuc lathe manual 4.3.1)

[[cycle]]
name = "PECK"
for_axis = "X"
native = "G87"
modal = true
params = { DEPTH = "X", CLEARANCE = "R", PECK = "Q", CYCLE_DWELL = "P", CYCLE_F = "F" }

[[cycle]]
name = "TAP"
native = "G84"
modal = true
params = { DEPTH = "Z", CLEARANCE = "R", CYCLE_DWELL = "P", CYCLE_F = "F" }           # the spindle reverses at the bottom (fanuc lathe manual 4.3.2)
# The rigid-tapping line "M29 S{rpm}" of the built-in TAP stands before G84 and G88 alike: M29 S before the tapping block makes either rigid (Fanuc
# B-64484EN-1 p. 112, 4.5.1; D256, D361). A machine file overrides it with its builder's code.

[[cycle]]
name = "TAP"
for_axis = "X"
native = "G88"
modal = true
params = { DEPTH = "X", CLEARANCE = "R", CYCLE_DWELL = "P", CYCLE_F = "F" }
before = "M29 S{rpm}"                                                                # side face rigid tapping, as G84 (B-64484EN-1 p. 112)

[[cycle]]
name = "TAP_COMPENSATING"
native = "G84"
modal = true
params = { DEPTH = "Z", CLEARANCE = "R", CYCLE_DWELL = "P", CYCLE_F = "F" }           # G84 without the rigid-tapping line: conventional mode (D359)

[[cycle]]
name = "TAP_COMPENSATING"
for_axis = "X"
native = "G88"
modal = true
params = { DEPTH = "X", CLEARANCE = "R", CYCLE_DWELL = "P", CYCLE_F = "F" }
# D359: tapping in conventional mode, the spindle started and reversed by M03/M04/M05 with a compensating chuck (B-64484EN-1 p. 110), the floating tap of
# every family; no before key, so the reader takes it for a G84 or G88 the rigid-tapping line does not reach.

[[cycle]]
name = "REAM"
native = "G85"
modal = true
params = { DEPTH = "Z", CLEARANCE = "R", CYCLE_DWELL = "P", CYCLE_F = "F" }           # feed in, dwell, feed out at twice the cutting feedrate (4.3.3)
dwell_native = "G85"                                                                 # a lathe G85 takes P itself: no G89 of the mill (D177)

[[cycle]]
name = "REAM"
for_axis = "X"
native = "G89"
modal = true
params = { DEPTH = "X", CLEARANCE = "R", CYCLE_DWELL = "P", CYCLE_F = "F" }

# ---------------------------------------------------------------------------------------------------------------------------------------------------
# Turning cycles, G-code system A (fanuc 3 and 6, controller-mapping 5, language 4.7.1)
#
# G90 (OD/ID), G92 (one thread pass) and G94 (face) are modal like the drilling cycles: a following block with only X, Z, R (or U, W) repeats the cycle with
# the new values, so the reader emits CYCLE= plus one CYCLE_CALL per block and the compiler writes them back the same way (language 4.7.1). X and Z (or U and
# W) of the cycle block and of every repeat block are the axis words of its CYCLE_CALL (language 4.7).
# The same numbers are G77/G78/G79 in system B and G20/G21/G24 in system C; the readers and compilers translate by gcode_system, and this file stays in
# system A (fanuc 3, D174).
# D161: THREAD is G76, the one-shot cycle that cuts the whole thread from the thread height with an automatic infeed, as Siemens CYCLE97 does; G92, the modal
# cycle that cuts one pass per block like G90 and G94, is THREAD_PASS, and COMPOUND_THREAD is dropped.
# D175: R of G90, G92 and G94 is the taper of the pass ("Verjuengung"), entered as a radius value, and the catalog carries it as the word TAPER. X(U), Z(W) and R
# are modal data the three cycles share, so a repeat block with a new R is a new CYCLE block, because a new CYCLE replaces all parameters (language 4.7).
# F is the cutting feed on G90 and G94 (CYCLE_F) and the thread lead on G92 and G76 (PITCH, language 4.7). The lead equals the pitch on a single-start thread; a
# multi-start thread is cut by shifting the thread start angle with Q, which has no NCX word and keeps its block RAW (D175).
# D114: TAPER is a parameter name of a catalog entry, the third provisional form of the parser: in a block whose CYCLE is not a built-in name, a key the word
# catalog does not know is a cycle parameter, checked against the machine's catalog by the VM; the mapping stands here because D175 decided it.

[[cycle]]
name = "TURN_OD"
native = "G90"
modal = true
params = { CYCLE_F = "F", TAPER = "R" }                                                # G90 X60. Z-70. F0.3 cuts one pass (language 4.7.1)
# G90 turns outer and inner diameters alike: one cycle, TURN_OD (language 4.7.1, controller-mapping 5; wave-1 question #17).

[[cycle]]
name = "THREAD_PASS"
native = "G92"
modal = true
params = { PITCH = "F", TAPER = "R" }                                                  # F is the thread lead L, R the taper (D175; the name of G92 is D161)

[[cycle]]
name = "FACE"
native = "G94"
modal = true
params = { CYCLE_F = "F", TAPER = "R" }                                                # F and R as on G90

# G70..G76 (finish, rough OD, rough face, pattern repeat, face cut-off, OD groove, multiple thread) are one-shot blocks (fanuc 6, language 4.7.1): modal = false.
# D176: only G70, G71, G72 and G73 take P and Q as the block range ns..nf of the finishing contour; on G74 and G75 P is the step the second plane axis moves and
# Q the step the first one moves, and on G76 P and Q carry the thread data. So contour = ["P", "Q"] (machine-config 6) stands on G70..G73 only; NCX carries that
# contour as a SUB section of the file, referenced by CONTOUR=name on the cycle block (D65, language 4.7).
# D176 names G73 PATTERN_REPEAT (with a contour) and G74 FACE_GROOVE (without one), and both stand in this lathe catalog, because their numbers are CHIP_BREAK
# and left-hand tapping on a mill, which cycles/fanuc.toml carries (D160, D176).
# TODO(question): the other words of G70..G76 (depth of cut, allowances, retract, thread data) and the two-block form of the lathe manual wait for the later
# catalog decision D175 leaves them to (fanuc 6; machine-config 6); no parameter of them is mapped, and a block that carries one stays RAW.

[[cycle]]
name = "FINISH"
native = "G70"
modal = false
contour = ["P", "Q"]

[[cycle]]
name = "ROUGH_TURN"
native = "G71"
modal = false
contour = ["P", "Q"]

[[cycle]]
name = "ROUGH_FACE"
native = "G72"
modal = false
contour = ["P", "Q"]

[[cycle]]
name = "PATTERN_REPEAT"
native = "G73"
modal = false
contour = ["P", "Q"]

[[cycle]]
name = "FACE_GROOVE"
native = "G74"
modal = false

[[cycle]]
name = "GROOVE"
native = "G75"
modal = false

[[cycle]]
name = "THREAD"
native = "G76"
modal = false
params = { PITCH = "F" }                                                               # F is the thread lead L of the second block (D175)

# FACE_GROOVE, GROOVE and THREAD carry no contour (D176): a face cut-off, an OD groove and a thread cut with G76 have no contour blocks, and the manual gives
# P and Q of G74 and G75 as the two infeed steps and those of G76 as the thread data. Such a block therefore carries words its entry does not map and the
# reader keeps it RAW (D5, D175).
