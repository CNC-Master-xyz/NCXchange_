# NCX cycle catalog of the Fanuc family (machine-config 6): the NCX cycle names, their parameter words and the G codes and addresses they map to.
# Written from controllers/fanuc.md 3 and 6, controller-mapping.md 5, language 4.7 and 4.7.1, and the drilling source examples/sources/BOHREN.fanuc.nc. Not verified on a machine.
# The drilling family (DRILL, DRILL_DWELL, PECK, CHIP_BREAK, TAP, REAM, BORE) is defined in code; its entries here say which G code and which addresses carry it
# on a Fanuc machining center. A machine file overrides an entry in its own [cycles] table (machine-config 6), as a lathe does for its drilling codes (see below).
# TODO(question): machine-config 6 has no key for the kind of a parameter ("Params with their kinds", phase 2 P2-03); every parameter of this file is a number or an expression (D115).

# ---------------------------------------------------------------------------------------------------------------------------------------------------
# Drilling family, machining centers (fanuc 6, controller-mapping 5)
#
# Rules of the Fanuc reader and compiler that no key of the catalog carries:
# - The cycle block defines and calls at its own position, every following block with a position calls again, G80 cancels (fanuc 9.5): modal = true.
# - CYCLE_RETRACT is the group 10 word of the cycle block: G99 returns to the R level (CLEARANCE), G98 to the initial level (SAFE) (controller-mapping 5).
# - SAFE is the initial level, the drilling-axis position before the cycle block; it has no address (controller-mapping 5).
# - SURFACE has no address: R minus the clearance of the machine file, or 0 (controller-mapping 5).
#   TODO(question): machine-config has no key for that clearance (D158).
# - Z and R are absolute under G90; the reader converts to the absolute DEPTH and CLEARANCE (fanuc 6). Z is the drilling axis of G17; on a mill the drilling axis
#   is the tool axis of G17..G19 (controller-mapping 5, AXIS), and no address carries AXIS.
# - K on the cycle block repeats the cycle at incremental steps; the reader expands it into CYCLE_CALL blocks (fanuc 6, controller-mapping 5).
# - F and P of the cycle block are the cycle's own feed and dwell and never touch the modal F of the program (controller-mapping 5, D29).
#   P is a dwell in milliseconds (fanuc 6), CYCLE_DWELL is seconds (language 4.7): the reader and the compiler convert.
# - The mill codes G74 (left-hand tapping), G76 (fine boring) and G87..G89 (back boring and variants) have no NCX cycle in the documents and no entry here.
#
# The NCX words of a drilling entry are its params plus the rules above. SURFACE and SAFE (no address on Fanuc) and CYCLE_RETRACT (G98/G99; on Heidenhain and
# Siemens also a rule, not a parameter) come from these reader and compiler rules in code. So the words that G81, CYCL DEF 200 and CYCLE81 share (SURFACE,
# CLEARANCE, DEPTH, SAFE, CYCLE_F, CYCLE_DWELL, CYCLE_RETRACT; phase 2 P2-03) are the params of each entry plus the rules of its family, not the params keys alone.
# TODO(question): machine-config 6 has no key that lists the NCX words an entry carries by a reader or compiler rule instead of a native parameter (D157).
#
# CYCLE_DWELL = "P" on every drilling entry: controller-mapping 5 gives CYCLE_F and CYCLE_DWELL as "F and P on the G8x block", and cycle 200 (Q211) and
# CYCLE81 (DTB) carry the dwell, so a dwell read from them survives on G81. fanuc 6 names the dwell P only for G82 ("G82 adds a dwell P").
# TODO(question): whether a Fanuc control executes the P of G81, G83, G73, G85 and G86 is not in the documents; the entries follow controller-mapping 5 (D177).

[[cycle]]
name = "DRILL"
native = "G81"
modal = true
params = { DEPTH = "Z", CLEARANCE = "R", CYCLE_DWELL = "P", CYCLE_F = "F" }           # G81 G99 Z-21.732 R5. F565 (fanuc 6)

[[cycle]]
name = "DRILL_DWELL"
native = "G82"
modal = true
params = { DEPTH = "Z", CLEARANCE = "R", CYCLE_DWELL = "P", CYCLE_F = "F" }           # G82 adds a dwell P (fanuc 6)

[[cycle]]
name = "PECK"
native = "G83"
modal = true
params = { DEPTH = "Z", CLEARANCE = "R", PECK = "Q", CYCLE_DWELL = "P", CYCLE_F = "F" }   # G83 G99 Z-21.732 R5. Q1.2 (BOHREN.fanuc.nc), full retract

[[cycle]]
name = "CHIP_BREAK"
native = "G73"
modal = true
params = { DEPTH = "Z", CLEARANCE = "R", PECK = "Q", CYCLE_DWELL = "P", CYCLE_F = "F" }   # G73 G99 Z-21.732 R5. Q1.2 (BOHREN.fanuc.nc)

[[cycle]]
name = "TAP"
native = "G84"
modal = true
params = { DEPTH = "Z", CLEARANCE = "R", CYCLE_DWELL = "P", CYCLE_F = "F" }           # G84 G99 Z-20. R5. P0 F750 (BOHREN.fanuc.nc)
# PITCH has no address of its own: it is F / S in per-minute mode and F in per-revolution mode (controller-mapping 5). M29 S before the cycle makes the
# tapping rigid (fanuc 6); that is a function of the machine file (a pre rule of an overriding entry, machine-config 5a).

[[cycle]]
name = "REAM"
native = "G85"
modal = true
params = { DEPTH = "Z", CLEARANCE = "R", CYCLE_DWELL = "P", CYCLE_F = "F" }           # G85 G99 Z-20. R5. F420 (BOHREN.fanuc.nc)

[[cycle]]
name = "BORE"
native = "G86"
modal = true
params = { DEPTH = "Z", CLEARANCE = "R", CYCLE_DWELL = "P", CYCLE_F = "F" }           # G86 bores (fanuc 6)

# Lathes drill with G83/G84/G85 along Z at a C position (AXIS=Z, the default) and with G87/G88/G89 along X on the circumference (AXIS=X); Mori Seiki adds
# G83.5/G87.5 and G83.6/G87.6 (controller-mapping 5, D59; examples/POLAR_FACE.ncx: DRILL with AXIS=X is G87). A lathe overrides the mill entries above in
# its machine file, as doosan-puma-2600sy.toml sketches for G83 with the PECK_MODE functions.
# TODO(question): the catalog has no key that picks an entry by the drilling axis (AXIS) or by the machine kind (mill or lathe), and the documents do not say
# which NCX cycle a lathe G85/G89 is; so this family catalog holds no lathe drilling entry (D160).

# ---------------------------------------------------------------------------------------------------------------------------------------------------
# Turning cycles of the lathes, G-code system A (gcode_system = "A": the Nakamura, Doosan and Mori Seiki machines of the corpus; fanuc 3 and 6)
#
# G90 (OD/ID), G92 (thread) and G94 (face) are modal like the drilling cycles: a following block with only X, Z, R (or U, W) repeats the cycle with the new
# values, so the reader emits CYCLE= plus one CYCLE_CALL per block and the compiler writes them back the same way (language 4.7.1). X and Z (or U and W) of the
# cycle block and of every repeat block are the axis words of its CYCLE_CALL (language 4.7).
# On mills and in the systems B and C the same numbers are absolute programming, the coordinate set and the feed per minute; the readers select their tables by
# gcode_system (fanuc 3). System B writes the three cycles as G77/G78/G79 (fanuc 3, controller-mapping 5).
# TODO(question): the catalog has no key that ties an entry to a G-code system; and for system C fanuc 3 gives G20/G21/G24 while controller-mapping 5 and
# language 4.7.1 give G77/G78/G79 "in B and C". Only the system A entries are written (D174).
# D175: R of G90, G92 and G94 is the taper of the pass ("Verjuengung"), entered as a radius value, and the catalog carries it as the word TAPER. X(U), Z(W) and R
# are modal data the three cycles share, so a repeat block with a new R is a new CYCLE block, because a new CYCLE replaces all parameters (language 4.7).
# F is the cutting feed on G90 and G94 (CYCLE_F) and the thread lead on G92 (PITCH, language 4.7). The lead equals the pitch on a single-start thread; a
# multi-start thread is cut by shifting the thread start angle with Q, which has no NCX word and keeps its block RAW (D175).
# TODO(question): TAPER is a parameter name of a catalog entry, and the parser takes none yet, so a block with R reads as RAW and no program can carry TAPER
# until D114 is answered; the mapping stands here because D175 decided it.

[[cycle]]
name = "TURN_OD"
native = "G90"
modal = true
params = { CYCLE_F = "F", TAPER = "R" }                                                # G90 X60. Z-70. F0.3 cuts one pass (language 4.7.1)
# G90 turns outer and inner diameters alike: one cycle, TURN_OD (language 4.7.1, controller-mapping 5; wave-1 question #17).

[[cycle]]
name = "THREAD"
native = "G92"
modal = true
params = { PITCH = "F", TAPER = "R" }                                                  # F is the thread lead L, R the taper (D175; the NCX name of G92 is D161)

[[cycle]]
name = "FACE"
native = "G94"
modal = true
params = { CYCLE_F = "F", TAPER = "R" }                                                # F and R as on G90

# G70..G76 (finish, rough OD, rough face, pattern repeat, face cut-off, OD groove, compound thread) are one-shot blocks (fanuc 6, language 4.7.1): modal = false.
# D176: only G70, G71, G72 and G73 take P and Q as the block range ns..nf of the finishing contour; on G74 and G75 P is the step the second plane axis moves and
# Q the step the first one moves, and on G76 P and Q carry the thread data. So contour = ["P", "Q"] (machine-config 6) stands on G70..G73 only; NCX carries that
# contour as a SUB section of the file, referenced by CONTOUR=name on the cycle block (D65, language 4.7).
# D176 names G73 PATTERN_REPEAT (with a contour) and G74 FACE_GROOVE (without one), and puts both in the lathe catalog, because their numbers are CHIP_BREAK and
# left-hand tapping on a mill and this file carries the mill entries as well.
# TODO(question): machine-config 6 has no key that ties an entry to the machine kind, so PATTERN_REPEAT (G73) and FACE_GROOVE (G74) cannot stand beside the mill
# entries here; they go into the lathe catalog (D160).
# TODO(question): the other words of G70..G76 (depth of cut, allowances, retract, thread data) and the two-block form of the lathe manual wait for the later
# catalog decision D175 leaves them to (fanuc 6; machine-config 6); no parameter of them is mapped, and a block that carries one stays RAW.

[[cycle]]
name = "FINISH"
native = "G70"
modal = false
contour = ["P", "Q"]

[[cycle]]
name = "ROUGH_TURN"
native = "G71"
modal = false
contour = ["P", "Q"]

[[cycle]]
name = "ROUGH_FACE"
native = "G72"
modal = false
contour = ["P", "Q"]

[[cycle]]
name = "GROOVE"
native = "G75"
modal = false

[[cycle]]
name = "COMPOUND_THREAD"
native = "G76"
modal = false
params = { PITCH = "F" }                                                               # F is the thread lead L of the second block (D175)

# GROOVE and COMPOUND_THREAD carry no contour (D176): an OD groove and a compound thread have no contour blocks, and the manual gives P and Q of G75 as the two
# infeed steps and those of G76 as the thread data. A G75 or G76 block therefore carries words its entry does not map and the reader keeps it RAW (D5, D175).
