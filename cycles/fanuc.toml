# NCX cycle catalog of the Fanuc family (machine-config 6): the NCX cycle names, their parameter words and the G codes and addresses they map to.
# Written from controllers/fanuc.md 3 and 6, controller-mapping.md 5, language 4.7 and 4.7.1, and the drilling source examples/sources/BOHREN.fanuc.nc. Not verified on a machine.
# The drilling family (DRILL, DRILL_DWELL, PECK, CHIP_BREAK, TAP, REAM, BORE) is defined in code; its entries here say which G code and which addresses carry it
# on a Fanuc machining center. A machine file overrides an entry in its own [cycles] table (machine-config 6), as a lathe does for its drilling codes (see below).
# D115: no kind key in 1.0; every parameter of this file that is not a word of language 4.7 takes a number or an expression, and the words of 4.7 keep their kinds.

# ---------------------------------------------------------------------------------------------------------------------------------------------------
# Drilling family, machining centers (fanuc 6, controller-mapping 5)
#
# Rules of the Fanuc reader and compiler that no key of the catalog carries:
# - The cycle block defines and calls at its own position, every following block with a position calls again, G80 cancels (fanuc 9.5): modal = true.
# - CYCLE_RETRACT is the group 10 word of the cycle block: G99 returns to the R level (CLEARANCE), G98 to the initial level (SAFE) (controller-mapping 5).
# - SAFE is the initial level, the drilling-axis position before the cycle block; it has no address (controller-mapping 5).
# - SURFACE has no address: R minus the clearance of the machine file, or 0 (controller-mapping 5).
#   TODO(question): machine-config has no key for that clearance (D158).
# - Z and R are absolute under G90; the reader converts to the absolute DEPTH and CLEARANCE (fanuc 6). Z is the drilling axis of G17; on a mill the drilling axis
#   is the tool axis of G17..G19 (controller-mapping 5, AXIS), and no address carries AXIS.
# - K on the cycle block repeats the cycle at incremental steps; the reader expands it into CYCLE_CALL blocks (fanuc 6, controller-mapping 5).
# - F and P of the cycle block are the cycle's own feed and dwell and never touch the modal F of the program (controller-mapping 5, D29).
#   P is a dwell in milliseconds (fanuc 6), CYCLE_DWELL is seconds (language 4.7): the reader and the compiler convert.
# - The mill codes G74 (left-hand tapping), G76 (fine boring) and G87..G89 (back boring and variants) have no NCX cycle in the documents and no entry here.
#
# The NCX words of a drilling entry are its params plus the rules above. SURFACE and SAFE (no address on Fanuc) and CYCLE_RETRACT (G98/G99; on Heidenhain and
# Siemens also a rule, not a parameter) come from these reader and compiler rules in code. So the words that G81, CYCL DEF 200 and CYCLE81 share (SURFACE,
# CLEARANCE, DEPTH, SAFE, CYCLE_F, CYCLE_DWELL, CYCLE_RETRACT; phase 2 P2-03) are the params of each entry plus the rules of its family, not the params keys alone.
# D157: those rule words follow from the params of every entry, with no key of their own: an entry that maps CLEARANCE = "R" carries SURFACE, SAFE and
# CYCLE_RETRACT, an entry whose native is the tapping code PITCH (D359), and an entry that maps DEPTH carries AXIS.
#
# D177: on a machining centre the dwell P stands only in the formats of G74, G76, G82, G84, G87, G88 and G89; G73, G81, G83, G85 and G86 have none (Fanuc
# B-64484EN-2 p. 56, 61-84). So CYCLE_DWELL = "P" stands on DRILL_DWELL (G82), TAP (G84) and REAM, whose dwell_native G89 is G85 with a dwell at the bottom:
# the compiler writes a REAM with a CYCLE_DWELL other than 0 as G89, which reads back as REAM with CYCLE_DWELL, and a DRILL with one as G82 (DRILL_DWELL);
# PECK, CHIP_BREAK and BORE with a dwell other than 0 get a compiler WARNING, "dwell dropped". The lathe catalog keeps P on every entry (fanuc-lathe.toml).

[[cycle]]
name = "DRILL"
native = "G81"
modal = true
params = { DEPTH = "Z", CLEARANCE = "R", CYCLE_F = "F" }                               # G81 G99 Z-21.732 R5. F565 (fanuc 6)

[[cycle]]
name = "DRILL_DWELL"
native = "G82"
modal = true
params = { DEPTH = "Z", CLEARANCE = "R", CYCLE_DWELL = "P", CYCLE_F = "F" }           # G82 adds a dwell P (fanuc 6)

[[cycle]]
name = "PECK"
native = "G83"
modal = true
params = { DEPTH = "Z", CLEARANCE = "R", PECK = "Q", CYCLE_F = "F" }                   # G83 G99 Z-21.732 R5. Q1.2 (BOHREN.fanuc.nc), full retract

[[cycle]]
name = "CHIP_BREAK"
native = "G73"
modal = true
params = { DEPTH = "Z", CLEARANCE = "R", PECK = "Q", CYCLE_F = "F" }                   # G73 G99 Z-21.732 R5. Q1.2 (BOHREN.fanuc.nc)

[[cycle]]
name = "TAP"
native = "G84"
modal = true
params = { DEPTH = "Z", CLEARANCE = "R", CYCLE_DWELL = "P", CYCLE_F = "F" }           # G84 G99 Z-20. R5. P0 F750 (BOHREN.fanuc.nc)
before = "M29 S{rpm}"                                                                # the rigid-tapping line directly before the cycle block, part of CYCLE=TAP (D256)
# PITCH has no address of its own: it is F / S in per-minute mode and F in per-revolution mode (controller-mapping 5). The line is the machine's, not the
# catalog's: a machine file overrides "before" with its builder's code (Mori Seiki "M329 S{rpm}", D361) and sets it to "" where parameter 5200 bit 0 makes
# G84 rigid without a line; a machine that names no rigid-tapping code writes M29, the Fanuc standard (parameter 5210 = 0; D361). A G84 the line does not
# reach is tapping with a compensating chuck, TAP_COMPENSATING below (fanuc 6, machine-config 6, D256, D359).

[[cycle]]
name = "TAP_COMPENSATING"
native = "G84"
modal = true
params = { DEPTH = "Z", CLEARANCE = "R", CYCLE_DWELL = "P", CYCLE_F = "F" }           # G84 without the rigid-tapping line (D359)
# D359: the floating tap on every family (D162), the word set of TAP with no before key. Of the two entries on G84 the reader takes the one whose before line
# reaches the block in one of D256's three ways, and this one where none does (machine-config 6, an amendment of D160); a bare G84 reads as
# CYCLE=TAP_COMPENSATING. Where a machine's TAP sets before = "", its G84 is always rigid and this entry counts as not in its catalog (CMP380).

[[cycle]]
name = "REAM"
native = "G85"
modal = true
params = { DEPTH = "Z", CLEARANCE = "R", CYCLE_DWELL = "P", CYCLE_F = "F" }           # G85 G99 Z-20. R5. F420 (BOHREN.fanuc.nc)
dwell_native = "G89"                                                                 # G85 with a dwell P at the bottom (D177)

[[cycle]]
name = "BORE"
native = "G86"
modal = true
params = { DEPTH = "Z", CLEARANCE = "R", CYCLE_F = "F" }                               # G86 bores (fanuc 6)

# Lathes drill with G83/G84/G85 along Z at a C position (AXIS=Z, the default) and with G87/G88/G89 along X on the circumference (AXIS=X); Mori Seiki adds
# G83.5/G87.5 and G83.6/G87.6 (controller-mapping 5, D59; examples/POLAR_FACE.ncx: DRILL with AXIS=X is G87). The lathe drilling cycles and the turning
# cycles of the family live in cycles/fanuc-lathe.toml, which a Fanuc lathe names in [cycles] catalog instead of this file; the entry key for_axis tells the
# Z triple from the X triple there (machine-config 6, D160). This file keeps the mill codes, and a machine file still overrides an entry of its own, as
# doosan-puma-2600sy.toml sketches for G83 with the PECK_MODE functions.
