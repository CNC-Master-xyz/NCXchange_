# NCX machine configuration sketch: Nakamura-Tome Super Mill WY-250L, Fanuc 31i-B, two turrets (two paths), L and R spindle, rotary tools on both turrets.
# Based on nakamura-ntjx.toml; only what the WY manuals of the cnc-manuals connector show otherwise is changed, each change cited:
# 4810004EEE = Nakamura-Tome Programming Manual 4810004EEE (2020, WY-250L folder); 4800602ECA = WY-250L Operation Manual 4800602ECA (Fanuc 31i/32i-B, 2020);
# WY-Anleitung 2008 = Programmieranleitung NC-Wort-Adresse Fanuc 31i Model A, WY-Serie (2008); Handbuch 2019 = Nakamura-Tome Programmierhandbuch (2019).
# The program pair of this machine is docs/spec/examples/sources/NAKAMURA_WY250L_O1000.nc and .P-2.nc. Schema draft 4. Not verified on the machine.
# D100 data (P2-04): home and limits in machine coordinates, rapid, max_feed and acceleration on every [[axis]], rpm_min, rpm_max and accel_time on every spindle table, the [positions] and [dynamics] tables.
# Strokes, rapids, feeds and spindle ranges are the specification of 4800602ECA; accelerations and the [dynamics] stay the plausible values of nakamura-ntjx.toml.

ncx_schema = 1                     # the version of the machine-configuration schema, not of NCXchange (machine-config 1, D348)

[machine]
name = "Nakamura WY-250L"
controller = "fanuc"
dialect = "31i-B"                  # Fanuc 31i/32i-B (4800602ECA, title)
builder = "nakamura"
gcode_system = "A"                 # G98/G99 feed per min/rev, U W H V incremental, G90 = turning cycle
s_binds_to_spindle_word = true     # "M88 S1000" then "M3 S100": the S goes to the spindle of the M code in the block
channels = [1, 2]                  # upper turret = path 1 (file O1000), lower turret = path 2 (file O1000.P-2)
units_default = "MM"
default_spindle = "S1"
default_holder = "T1"
default_workpiece = "S1"

[format]
decimal_separator = "."
decimals = { X = 3, Z = 3, Y = 3, C = 3, B = 3, F = 3, S = 0 }
trailing_zeros = false
block_numbers = { enabled = false }
line_ending = "CRLF"
program_end = "M30"                # written for PROGRAM=END (D48)
channel_files = "path_suffix"      # job output: O1000 for path 1 and O1000.P-2 for path 2, no extension (D310)
sub_end = "M99"

[roles]
MAIN = "S1"
SUB = "S2"
TOOL = "S3"
TURRET1 = "T1"
TURRET2 = "T2"

[[resource]]
id = "S1"
type = "work_spindle"
axis = "C1"

[[resource]]
id = "S2"
type = "work_spindle"
axis = "C2"

[[resource]]
id = "S3"
type = "tool_spindle"              # the rotary tool drive of the upper turret (4800602ECA p.27: both turrets take turning and rotary tools; p.187 rotary tool drive upper/lower)
# TODO(question): the lower turret drives rotary tools too, with the same M88/M89/M90 in its own path (4810004EEE p.75, p.159), but a spindle table binds its codes
# to one role, so M88 of path 2 reads as SPINDLE:TOOL of this drive, as on nakamura-ntjx.toml; a second tool spindle needs a per-channel spindle table.

[[resource]]
id = "T1"
type = "tool_holder"
spindle = "S3"
magazine = false                   # upper turret, 24 stations, no ATC (4800602ECA p.27, p.186)
channel = 1

[[resource]]
id = "T2"
type = "tool_holder"
magazine = false                   # lower turret, 24 stations (4800602ECA p.27, p.186)
channel = 2

# D100: home and limits are machine coordinates (the G53 frame); the reference point is the machine zero of X, Z, Y and B. The limits of a C axis are its display range, not a travel limit.
# D137: the X values of an axis programmed in diameters are written as diameters, the way the axis is programmed (Fanuc parameters 1320/1321 are diameter values too); the VM halves home and limits once on load, and [positions] stays as written.

[[axis]]
id = "X1"
ncx = "X"
letter = "X"
programming = "diameter"           # D60: X words are diameters on this machine
incremental_letter = "U"
kind = "linear"
limits = [-321, 0]                 # mm as a diameter (D137), machine coordinates; X = 0 is the reference point; X1 travel 160.5 mm, X2 165 mm (4800602ECA p.183)
rapid = 18000                      # mm/min, X1/X2 (4800602ECA p.27, p.188)
max_feed = 8000                    # mm/min, cutting feed 1 to 8000 (4800602ECA p.188)
acceleration = 3000                # mm/s^2
home = 0                           # reference point 1, written through [home] (G28 U0)

[[axis]]
id = "Z1"
ncx = "Z"
letter = "Z"
incremental_letter = "W"
kind = "linear"
limits = [-910, 0]                 # mm; Z = 0 is the reference point away from the L spindle; Z1/Z2 travel 910 mm (4800602ECA p.183)
rapid = 40000                      # Z1/Z2 (4800602ECA p.27, p.188)
max_feed = 8000
acceleration = 3000
home = 0

[[axis]]
id = "Y1"
ncx = "Y"
letter = "Y"
incremental_letter = "V"
kind = "linear"
limits = [-50, 50]                 # mm; Y1 +-50, Y2 -50/+20 with downward positive on the lower turret (4800602ECA p.183)
rapid = 10000                      # Y1/Y2 (4800602ECA p.27, p.188)
max_feed = 8000
acceleration = 2000
home = 0

[[axis]]
id = "C1"
ncx = "C"
letter = "C"
incremental_letter = "H"
kind = "rotary"
owner = "S1"
limits = [0, 360]                  # degrees; modulo axis
modulo = true                      # the limits are the display range, not a travel limit (D193)
rapid = 216000                     # deg/min, rapid index 600 min-1 (4800602ECA p.185)
max_feed = 4800                    # deg/min, C-axis cutting feed 1 to 4800 (4800602ECA p.185)
acceleration = 2000                # deg/s^2
home = 0                           # the spindle zero mark (G28 H0)

[[axis]]
id = "B1"
ncx = "B"
letter = "B"
kind = "linear"                    # the R spindle slide, the B2 axis of the manual (4800602ECA p.30-31)
owner = "S2"
limits = [-945, 0]                 # mm; B = 0 is the reference point with the slide retracted (G28 B0); B2 travel 945 mm (4800602ECA p.183)
rapid = 40000                      # B2 (4800602ECA p.27, p.188)
max_feed = 8000
acceleration = 3000
home = 0

[[axis]]
id = "C2"
ncx = "C2"                         # a program writes C; the VM resolves it to C2 while the sub spindle holds the workpiece (VM 3.8 rule 3)
# The NTJX is a two-path lathe, so its sub spindle C axis is the C2 axis commanded with plain C and H (Nakamura ECL-1 2013 p.235 §14-5-8; NT-Nurse 4800001EBG
# p.347 "56 NTJX Drehmaschine mit 2 Bahnen"; Programmierhandbuch 2019 p.174-175, G28 H0 after M491). M432/M442 change which axis C drives, not the address (D179).
letter = "C"
incremental_letter = "H"
kind = "rotary"
owner = "S2"                       # the C axis that resource S2 names (F23); M491 / M441 switch the sub spindle
limits = [0, 360]                  # degrees; modulo axis
modulo = true                      # the limits are the display range, not a travel limit (D193)
rapid = 216000                     # the R spindle C axis as the L spindle's (4800602ECA p.185)
max_feed = 4800
acceleration = 2000
home = 0

[positions]                        # named machine-frame positions (D100); an expansion rule reaches them with {position:NAME}, e.g. pre = ["RAPID {position:tool_change} FRAME=MACHINE"]
tool_change = { X = 0, Z = -120 }  # clearance point of turret 1 for the ATC change (the values of machine-config 4)
program_end = { X = 0, Z = 0 }     # the reference point (G28 U0 W0 in the WY-250L sample programs)

[dynamics]                         # control behaviour for the runtime estimate (D64)
block_time = 0.004                 # seconds per block
path_mode = "continuous"           # G64 cutting mode (fanuc 3, group 15)
corner_speed = 1000                # mm/min carried through a corner

[tool_change]
change = "T{tool:02}{offset:02}"   # turret indexing: two digits of the station, two of the offset (4810004EEE p.66), stations 1 to 24 (p.69), "G0T0101" in the WY pair;
                                   # turret 2 (channel 2) needs no table of its own, its T word is the same turret form with the role TURRET2 (D219). No ATC, so no preload.
unload = "G0 T{tool:02}00"         # offset number 00 cancels the offset (4810004EEE p.68; Handbuch 2019 p.11 "G0 T0500")

[home]
template = "G28 {axes}"            # G28 U0, G28 W0, G28 B0, G28 H0 (C axis) as in the sample programs
point = "G330 A{point}."           # NT NURSE reference points 2..4

[setpos]
template = "G50 {axes}"            # G50 C0. after G28 H0 before G112 polar interpolation

[spindle.MAIN]
CW = "M3"
CCW = "M4"
OFF = "M5"
ORIENT = "M19"
RPM = "S{rpm}"
VC = "G96 S{value}"
CSS_OFF = "G97"
RPM_MAX = "G50 S{value}"
rpm_min = 45                       # machine limits, not the program's RPM_MAX clamp: the expander warns or clamps (D64); L spindle 45 to 4500 min-1 (4800602ECA p.27)
rpm_max = 4500
accel_time = 3.0                   # seconds from stop to rpm_max, for the runtime estimate

[spindle.SUB]
CW = "M53"
CCW = "M54"
OFF = "M55"
ORIENT = "M419"
rpm_min = 50                       # R spindle 50 to 5000 min-1 (4800602ECA p.27)
rpm_max = 5000
accel_time = 2.0

[spindle.TOOL]
CW = "M88"
CCW = "M89"
OFF = "M90"
rpm_min = 50
rpm_max = 6000                     # rotary tool spindle range 6000 min-1 (4800602ECA p.187)
accel_time = 1.0

[spindle_mode.MAIN]
AXIS = "M91"
SPINDLE = "M41"

[spindle_mode.SUB]
AXIS = "M491"
SPINDLE = "M441"

[spindle_sync]
ON = "M96"                         # sub follows main, speed and direction; cycle form G496 / G497 on NT NURSE 9.01 and up
OFF = "M97"
PHASE = "M92"                      # phase-synchronous run; M93 sets the phase position
channel = 2                        # the codes go into the program of the path that owns the second spindle, the lower turret (M96/M97 in O1000.P-2 of the WY pair)

[workpiece]
MAIN = "M428"                      # the selection code alone; the datum of the side is ORIGIN where the program writes it (D222)
SUB = "M427"
SUB_frame = "datum"                # G59 side programmed in machine Z; or mirror with the G360/G361 cycles (M700/M701), then datum and offsets carry inverted signs
# SUB_mirror = { ON = "G360", OFF = "G361" }

[sync]
wait = "M{mark}"
mark_range = [100, 199]            # M100 to M199 are the waiting M codes of the WY series (4810004EEE p.75, p.159-160 item 91)
paths = "list"                     # two paths: no P needed
start_mark = 199                   # the program-start mark of the WY header template, "M199 (PRG.-START SYNCHRONISATION)" in both turret programs (WY-Anleitung 2008 p.21;
                                   # Handbuch 2019 p.15) and in the WY pair after its set-up blocks, so the job compiler writes no start mark after the header of that
                                   # pair (machine-config 5, D314, D388)
reserved_marks = [198, 199]        # M198 "(** STANGEN-END ABFRAGE **)" is the wait both turret programs of the WY template pass before the bar change (WY-Anleitung 2008 p.21;
                                   # Handbuch 2019 p.15; both turret programs of the WT/WY example 4810004EEE p.333 open with M198), a waiting M code like every M100
                                   # to M199 (4810004EEE p.159-160), so it stays a SYNC and no function; the G196 transfer cycle waits at M199
                                   # (D315). A generated SYNC takes neither.

[coolant]
STANDARD = { ON = "M8", OFF = "M9" }
LOW_PRESSURE = { ON = "M7", OFF = "M9" }
MEDIUM_PRESSURE = { ON = "M708", OFF = "M9" }
THROUGH_SUB = { ON = "M742", OFF = "M743" }
TOOL_SPINDLE_INTERNAL = { ON = "M720", OFF = "M9" }

[func]
MAIN_CHUCK = { CLOSE = "M10", OPEN = "M11" }
SUB_CHUCK = { CLOSE = "M50", OPEN = "M51" }
MAIN_CLAMP = { ON = "M86", OFF = "M87" }
SUB_CLAMP = { ON = "M32", OFF = "M33" }
MAIN_AIR = { ON = "M20", OFF = "M21" }
SUB_AIR = { ON = "M420", OFF = "M421" }
PARTS_CATCHER = { FORWARD = "M68", BACK = "M69" }
EJECTOR = { FORWARD = "M484" }
BAR_LOADER = { CHANGE = "M58", FEED = "M61" }
DOOR = { OPEN = "M62", CLOSE = "M63" }
Y_REFERENCE = { CLAMP = "M370", FREE = "M371" }
TAP_REVERSE = { ON = "M94", OFF = "M95" }   # M29 S{rpm}, the rigid tapping line of both paths, is the "before" of the catalog's TAP (D256); M29 is its only rigid-tapping code (4810004EDG-1 p.312), M429 the work counter (p.148-149; D377)
THREAD_CHAMFER = { ON = "M23", OFF = "M24" }
LOAD_MONITOR = { ON = "M300", OFF = "M301" }
TOOL_COUNTER = { ON = "M303", OFF = "M304" }
PROBE = { ON = "M712", OFF = "M713" }
PART_STATUS = { LEFT_FINISHED = "M797", RIGHT_FINISHED = "M799", LEFT_RAW = "M705", CUTOFF_DONE = "M405" }   # part status for G411 jump programming
CSS_MONITOR = { ON = "M416", OFF = "M417" }
C_MIX = { MAIN_ON = "M432", MAIN_OFF = "M433", SUB_ON = "M442", SUB_OFF = "M443" }   # C-axis command mix (mixture control)

[transform]
CYLINDER_ON = "G107 C{r}"          # {r} is the reference radius of CYLINDER=n (D96); Nakamura alias of G7.1 C{r}
CYLINDER_OFF = "G107 C0"
POLAR_ON = "G112"
POLAR_OFF = "G113"
# No TCPM_ON/TCPM_OFF (G435/G436) and no TILT_ON/TILT_OFF (G368/G369): those serve the B-axis tool spindle of the NTJX; the WY-250L has two turrets and no
# B-axis head (4800602ECA p.27, p.30-31).

[cycles]
catalog = "fanuc-lathe.toml"       # the Fanuc lathe catalog: drilling along Z and along X by for_axis, turning cycles in system A numbers (machine-config 6, D160, D174)
[raw]                              # builder macros kept as RAW:NAKAMURA; G471..G486 and G480 are read as JUMP, not RAW
known = ["G411", "G300", "G131", "G359", "G333", "G200", "G355", "G376", "G377", "G342", "G344", "G350", "G419", "G496", "G497"]

[system_variables]                 # NCX SYS_ names to Fanuc system variables (machine-config 7, D51, D250)
SYS_WEAR_Z = "#11{index:03}"       # Z wear of offset n, #11001-#11999 #_OFSZW[n] (30i-B operator's manual B-64484EN p.455)
SYS_MPOS_B = "#5025"               # machine position of the 5th axis: the WY address order X, Z, C, Y, B makes B the 5th (#5021-#5040, B-64484EN p.488).
                                   # #5024 stays unmapped, so its block stays RAW:FANUC with a WARNING; confirm the axis number on the machine (D250)
